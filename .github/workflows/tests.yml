name: Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Lets publish.yml run the full suite before releasing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lint and types do not depend on the OS or Python version,
  # so run them once instead of in every matrix cell.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting and lint
      run: |
        python -m black --check src tests
        python -m ruff check src tests

    - name: Check types
      run: python -m mypy src/latex2code

  # Full suite with both optional frameworks installed.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        cache: pip
        cache-dependency-path: pyproject.toml

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install "jax[cpu]>=0.4"

    - name: Run Pytest
      run: python -m pytest -rs

  # Same suite without torch/jax: their tests must skip cleanly, and nothing
  # else may quietly depend on them.
  no-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install project and test dependencies only
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest
      run: python -m pytest -rs

  # What a user gets from a plain `pip install latex2code`: no extras, no dev
  # tools, no torch/jax (which would pull in SciPy). Generated code must run.
  minimal-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        cache: pip
        cache-dependency-path: pyproject.toml
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install the package with runtime dependencies only
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip check

    - name: Smoke test
      run: |
        latex2code --version
        latex2code '\frac{a}{b}' --name divide
        latex2code 'x + w' --args w,x --no-types | grep -q 'def formula(w, x):'
        python - <<'EOF'
        import importlib.util

        import numpy as np

        for name in ("scipy", "torch", "jax", "pytest"):
            assert importlib.util.find_spec(name) is None, f"{name} must not be installed"

        from latex2code import compile_latex

        x = np.linspace(0, 10, 50)
        wave = compile_latex(r"\frac{\sin(x)}{\sqrt{x^2 + 1}}", backend="numpy")
        assert np.allclose(wave(x), np.sin(x) / np.sqrt(x**2 + 1))

        softmax = compile_latex(r"\operatorname{softmax}(x)", backend="numpy")
        values = np.array([1.0, 2.0, 3.0])
        expected = np.exp(values - values.max())
        assert np.allclose(softmax(values), expected / expected.sum())

        silu = compile_latex(r"\operatorname{silu}(x)")
        assert abs(silu(-1000.0)) < 1e-12  # must not raise OverflowError

        ratio = compile_latex(r"\frac{x}{y}")
        assert ratio(6, 3) == 2

        matrix = compile_latex(r"\begin{pmatrix} x^2 & 1 \\ 0 & y \end{pmatrix}")
        assert np.array_equal(matrix(2, 3), np.array([[4, 1], [0, 3]]))

        print("minimal install OK")
        EOF

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Build source distribution and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check dist/*
    - name: Install the wheel in a clean environment
      run: |
        python -m venv /tmp/wheel-test
        /tmp/wheel-test/bin/pip install dist/*.whl
        /tmp/wheel-test/bin/latex2code --version
        /tmp/wheel-test/bin/python - <<'EOF'
        from importlib.resources import files

        assert files("latex2code").joinpath("py.typed").is_file(), "py.typed missing"
        print("wheel OK")
        EOF
