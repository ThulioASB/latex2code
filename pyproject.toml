[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2code"
version = "0.2.0"
authors = [
  { name="Thúlio Brandão" },
]
description = "A lightweight Python library and CLI tool to transpile LaTeX mathematical expressions into executable Python functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["latex", "sympy", "python", "transpile", "mathematics", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/ThulioASB/latex2code"
Repository = "https://github.com/ThulioASB/latex2code"
Issues = "https://github.com/ThulioASB/latex2code/issues"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2.0",
]
torch = ["torch>=2.0"]
jax = ["jax>=0.4"]

[project.scripts]
latex2code = "latex2code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=latex2code --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
latex2code = ["py.typed"]