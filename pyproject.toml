[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2code"
version = "0.1.0"
description = "Transpilador de expressões LaTeX para funções executáveis em Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
latex2code = "latex2code.cli:main"