[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2code"
version = "0.2.0"
authors = [
  { name="Thúlio Brandão" },
]
description = "A lightweight Python library and CLI tool to transpile LaTeX mathematical expressions into executable Python functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["latex", "sympy", "python", "transpile", "mathematics", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/ThulioASB/latex2code"
Repository = "https://github.com/ThulioASB/latex2code"
Issues = "https://github.com/ThulioASB/latex2code/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.2.0",
]
torch = ["torch>=2.0"]
jax = ["jax>=0.4"]

[project.scripts]
latex2code = "latex2code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]