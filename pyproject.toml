[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2code"
version = "0.3.0"
authors = [
    { name="Thúlio Brandão" },
]
description = "Transpile LaTeX math into readable Python functions for plain Python, NumPy, PyTorch, or JAX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "latex",
    "sympy",
    "python",
    "transpile",
    "code-generation",
    "mathematics",
    "numpy",
    "pytorch",
    "jax",
    "machine-learning",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "sympy>=1.12",
    # SymPy's ANTLR LaTeX parser needs the 4.11 runtime. Allow patch releases
    # instead of an exact pin so this library does not conflict with others.
    "antlr4-python3-runtime>=4.11.0,<4.12",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/ThulioASB/latex2code"
Documentation = "https://github.com/ThulioASB/latex2code/tree/main/docs"
Repository = "https://github.com/ThulioASB/latex2code"
Issues = "https://github.com/ThulioASB/latex2code/issues"
Changelog = "https://github.com/ThulioASB/latex2code/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2.0",
    # Used only as a reference implementation in tests (the library and its
    # generated NumPy code do not import SciPy).
    "scipy>=1.10",
]
torch = ["torch>=2.0"]
jax = ["jax>=0.4"]

[project.scripts]
latex2code = "latex2code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=latex2code --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
latex2code = ["py.typed"]
